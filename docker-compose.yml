services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: rps
      POSTGRES_PASSWORD: rps
      POSTGRES_DB: rps_dev
    ports:
      - "5432:5432"
    volumes:
      - rps_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rps -d rps_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rps_db_data:
